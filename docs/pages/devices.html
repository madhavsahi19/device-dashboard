<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeviceWatch — Device Master</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="app-bg">

<div class="app-shell">
  <div id="sidebarMount"></div>

  <main class="main">
    <div id="topbarMount"></div>

    <section class="form-panel">
      <h3>Add a device or service</h3>
      <div class="panel-sub">Saved directly to MySQL through the backend API. Status is set manually here — there's no automated health check yet.</div>

      <form id="deviceForm">
        <div class="form-grid">
          <div class="field">
            <label for="devName">Device Name</label>
            <input type="text" id="devName" placeholder="e.g. Core Switch 02" required>
          </div>
          <div class="field">
            <label for="devType">Device Type</label>
            <select id="devType" required>
              <option value="" disabled selected>Select type</option>
            </select>
          </div>
          <div class="field">
            <label for="devAddress">IP Address / Service URL</label>
            <input type="text" id="devAddress" placeholder="e.g. 10.0.1.5 or https://service.local" required>
          </div>
          <div class="field">
            <label for="devLocation">Location</label>
            <input type="text" id="devLocation" placeholder="e.g. Server Room A" required>
          </div>
          <div class="field">
            <label for="devStatus">Status</label>
            <select id="devStatus" required>
              <option value="online">Online</option>
              <option value="warning">Warning</option>
              <option value="offline">Offline</option>
            </select>
          </div>
          <div class="field">
            <label for="devRemarks">Remarks</label>
            <input type="text" id="devRemarks" placeholder="Optional notes">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-add">Add device</button>
        </div>
      </form>
    </section>

    <section class="table-panel">
      <div class="table-panel-header">
        <h3>Device master list</h3>
        <div class="table-tools">
          <input type="text" class="search-input" id="searchInput" placeholder="Search name, IP, location...">
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Device Name</th>
              <th>Type</th>
              <th>IP / Service URL</th>
              <th>Location</th>
              <th>Status</th>
              <th>Status Set At</th>
              <th>Remarks</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="deviceTableBody"></tbody>
        </table>
      </div>
      <div class="table-panel-header" id="paginationBar" style="border-top: 1px solid var(--line); border-bottom: none;"></div>
    </section>
  </main>
</div>

<div class="toast" id="toast">Device added</div>

<script src="../js/config.js"></script>
<script src="../js/data.js"></script>
<script src="../js/layout.js"></script>
<script>
  requireAuth("../login.html");
  renderShell({
    active: "devices",
    title: "Device Master",
    desc: "Add and manage the devices and services being monitored",
    basePath: "../",
  });

  const typeSelect = document.getElementById("devType");
  DEVICE_TYPES.forEach(t => {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  });

  let currentPage = 1;
  const pageSize = 50;
  let currentTotal = 0;

  function statusLabel(s) {
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2200);
  }

  function renderTable(devices) {
    const tbody = document.getElementById("deviceTableBody");
    if (!devices.length) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state">No devices match your search.</div></td></tr>`;
      return;
    }
    tbody.innerHTML = devices.map(d => `
      <tr>
        <td class="dev-name">${escapeHtml(d.name)}</td>
        <td><span class="dev-type-badge">${escapeHtml(d.type)}</span></td>
        <td class="mono">${escapeHtml(d.address)}</td>
        <td>${escapeHtml(d.location)}</td>
        <td>
          <span class="status-pill ${d.status}">
            <span class="dot"></span>${statusLabel(d.status)}
          </span>
        </td>
        <td class="mono">${escapeHtml(d.statusSetAt)}</td>
        <td>${d.remarks ? escapeHtml(d.remarks) : '<span style="color:var(--muted)">—</span>'}</td>
        <td>
          <div class="row-actions">
            <button class="icon-btn" title="Delete" onclick="handleDelete(${d.id})">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
            </button>
          </div>
        </td>
      </tr>
    `).join("");
  }

  function renderPagination() {
    const totalPages = Math.max(1, Math.ceil(currentTotal / pageSize));
    const start = currentTotal === 0 ? 0 : (currentPage - 1) * pageSize + 1;
    const end = Math.min(currentPage * pageSize, currentTotal);
    document.getElementById("paginationBar").innerHTML = `
      <div style="color: var(--muted); font-size: 13px;">Showing ${start}-${end} of ${currentTotal}</div>
      <div class="table-tools">
        <button class="btn-secondary" id="prevPageBtn" ${currentPage <= 1 ? "disabled" : ""}>Previous</button>
        <div style="color: var(--muted); font-size: 13px; align-self: center;">Page ${currentPage} of ${totalPages}</div>
        <button class="btn-secondary" id="nextPageBtn" ${currentPage >= totalPages ? "disabled" : ""}>Next</button>
      </div>
    `;
    document.getElementById("prevPageBtn").addEventListener("click", () => {
      if (currentPage > 1) { currentPage--; refresh(); }
    });
    document.getElementById("nextPageBtn").addEventListener("click", () => {
      currentPage++; refresh();
    });
  }

    let refreshRequestId = 0;

  function renderTableError(message) {
    document.getElementById("deviceTableBody").innerHTML = `
      <tr><td colspan="8">
        <div class="empty-state" style="color: var(--offline);">
          Could not load devices: ${escapeHtml(message)}
          <div style="margin-top:12px;"><button class="btn-secondary" onclick="refresh()">Retry</button></div>
        </div>
      </td></tr>`;
    document.getElementById("paginationBar").innerHTML = "";
  }

  async function refresh() {
    const requestId = ++refreshRequestId;
    const chip = document.getElementById("connectionChip");
    try {
      const search = document.getElementById("searchInput").value;
      const result = await loadDevices({ page: currentPage, limit: pageSize, search, status: "all" });
      if (requestId !== refreshRequestId) return; // a newer request replaced this one

      // If the last item on a page was deleted, move back to the last valid page
      if (result.devices.length === 0 && result.total > 0 && currentPage > 1) {
        currentPage = Math.ceil(result.total / pageSize);
        return refresh();
      }

      currentTotal = result.total;
      renderTable(result.devices);
      renderPagination();
      if (chip) chip.innerHTML = `<span class="live-dot"></span> Manual status &middot; MySQL connected`;
    } catch (err) {
      if (requestId !== refreshRequestId) return;
      renderTableError(err.message);
      if (chip) {
        chip.innerHTML = `<span class="live-dot" style="background: var(--offline);"></span> Manual status &middot; Could not load data`;
      }
    }
  }

  async function handleDelete(id) {
    if (confirm("Remove this device from the master list?")) {
      try {
        await deleteDevice(id);
        await refresh();
        showToast("Device removed");
      } catch (err) {
        showToast(err.message || "Failed to delete device");
      }
    }
  }

  document.getElementById("deviceForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const device = {
      name: document.getElementById("devName").value.trim(),
      type: document.getElementById("devType").value,
      address: document.getElementById("devAddress").value.trim(),
      location: document.getElementById("devLocation").value.trim(),
      status: document.getElementById("devStatus").value,
      remarks: document.getElementById("devRemarks").value.trim(),
    };
    const submitBtn = this.querySelector(".btn-add");
    submitBtn.disabled = true;
    submitBtn.textContent = "Adding...";
    try {
      await addDevice(device);
      this.reset();
      typeSelect.selectedIndex = 0;
      currentPage = 1;
      await refresh();
      showToast(`"${device.name}" added to the master list`);
    } catch (err) {
      showToast(err.message || "Failed to add device");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Add device";
    }
  });

  let searchDebounce;
  document.getElementById("searchInput").addEventListener("input", () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => { currentPage = 1; refresh(); }, 350);
  });

  refresh();
</script>

</body>
</html>
