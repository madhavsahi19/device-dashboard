<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeviceWatch — Dashboard</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body class="app-bg">

<div class="app-shell">
  <div id="sidebarMount"></div>

  <main class="main">
    <div id="topbarMount"></div>

    <section class="card-grid" id="cardGrid"></section>

    <section class="panel-grid">
      <div class="panel">
        <h3>Online vs Offline</h3>
        <div class="panel-sub">Live breakdown across all monitored devices and services</div>
        <div style="height: 240px; position: relative;"><canvas id="statusDoughnut"></canvas></div>
        <div class="legend-row" id="doughnutLegend"></div>
      </div>

      <div class="panel">
        <h3>Devices by type</h3>
        <div class="panel-sub">Where your monitored inventory is concentrated</div>
        <div style="height: 240px; position: relative;"><canvas id="typeBar"></canvas></div>
      </div>
    </section>

    <section class="table-panel">
      <div class="table-panel-header">
        <h3>All devices — current status</h3>
        <div class="table-tools">
          <input type="text" class="search-input" id="searchInput" placeholder="Search name, IP, location...">
          <select class="filter-select" id="statusFilter">
            <option value="all">All statuses</option>
            <option value="online">Online</option>
            <option value="offline">Offline</option>
            <option value="warning">Warning</option>
          </select>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Device Name</th>
              <th>Type</th>
              <th>IP / Service URL</th>
              <th>Location</th>
              <th>Status</th>
              <th>Last Checked</th>
              <th>Remarks</th>
            </tr>
          </thead>
          <tbody id="deviceTableBody"></tbody>
        </table>
      </div>
      <div class="table-panel-header" id="paginationBar" style="border-top: 1px solid var(--line); border-bottom: none;"></div>
    </section>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script>
  requireAuth();
  renderShell({
    active: "dashboard",
    title: "Dashboard",
    desc: "Overview of every monitored device and service",
  });

  let currentPage = 1;
  const pageSize = 50;
  let currentTotal = 0;
  let doughnutChart, barChart;

  function statusLabel(s) {
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function renderCards(summary) {
    document.getElementById("cardGrid").innerHTML = `
      <div class="stat-card total">
        <div class="accent-bar"></div>
        <div class="eyebrow">Total Devices</div>
        <div class="value">${summary.total}</div>
        <div class="sub">Across all locations</div>
      </div>
      <div class="stat-card online">
        <div class="accent-bar"></div>
        <div class="eyebrow">Online</div>
        <div class="value">${summary.online}</div>
        <div class="sub">${summary.total ? Math.round((summary.online / summary.total) * 100) : 0}% of fleet healthy</div>
      </div>
      <div class="stat-card offline">
        <div class="accent-bar"></div>
        <div class="eyebrow">Offline</div>
        <div class="value">${summary.offline}</div>
        <div class="sub">Needs attention now</div>
      </div>
      <div class="stat-card warning">
        <div class="accent-bar"></div>
        <div class="eyebrow">Warning</div>
        <div class="value">${summary.warning}</div>
        <div class="sub">Degraded but reachable</div>
      </div>
    `;
  }

  function renderCharts(summary, typeCounts) {
    const doughnutCtx = document.getElementById("statusDoughnut");
    if (doughnutChart) doughnutChart.destroy();
    doughnutChart = new Chart(doughnutCtx, {
      type: "doughnut",
      data: {
        labels: ["Online", "Offline", "Warning"],
        datasets: [{
          data: [summary.online, summary.offline, summary.warning],
          backgroundColor: ["#34D399", "#F5657B", "#F5B95B"],
          borderColor: "#10192E",
          borderWidth: 3,
          hoverOffset: 6,
        }],
      },
      options: { cutout: "68%", maintainAspectRatio: false, plugins: { legend: { display: false } } },
    });

    document.getElementById("doughnutLegend").innerHTML = `
      <div class="legend-item"><span class="legend-dot" style="background:#34D399"></span>Online — ${summary.online}</div>
      <div class="legend-item"><span class="legend-dot" style="background:#F5657B"></span>Offline — ${summary.offline}</div>
      <div class="legend-item"><span class="legend-dot" style="background:#F5B95B"></span>Warning — ${summary.warning}</div>
    `;

    const barCtx = document.getElementById("typeBar");
    if (barChart) barChart.destroy();
    barChart = new Chart(barCtx, {
      type: "bar",
      data: {
        labels: typeCounts.map(t => t.type),
        datasets: [{
          data: typeCounts.map(t => t.count),
          backgroundColor: "#4FD1C5",
          borderRadius: 5,
          maxBarThickness: 28,
        }],
      },
      options: {
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: "#8B96B5", font: { size: 11 } }, grid: { display: false } },
          y: { ticks: { color: "#8B96B5" }, grid: { color: "#24304F" }, beginAtZero: true },
        },
      },
    });
  }

  function renderTable(devices) {
    const tbody = document.getElementById("deviceTableBody");
    if (!devices.length) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state">No devices match your search/filter.</div></td></tr>`;
      return;
    }
    tbody.innerHTML = devices.map(d => `
      <tr>
        <td class="dev-name">${d.name}</td>
        <td><span class="dev-type-badge">${d.type}</span></td>
        <td class="mono">${d.address}</td>
        <td>${d.location}</td>
        <td>
          <span class="status-pill ${d.status}">
            <span class="dot"></span>${statusLabel(d.status)}
          </span>
        </td>
        <td class="mono">${d.lastChecked}</td>
        <td>${d.remarks ? d.remarks : '<span style="color:var(--muted)">—</span>'}</td>
      </tr>
    `).join("");
  }

  function renderPagination() {
    const totalPages = Math.max(1, Math.ceil(currentTotal / pageSize));
    const start = currentTotal === 0 ? 0 : (currentPage - 1) * pageSize + 1;
    const end = Math.min(currentPage * pageSize, currentTotal);
    document.getElementById("paginationBar").innerHTML = `
      <div style="color: var(--muted); font-size: 13px;">Showing ${start}-${end} of ${currentTotal}</div>
      <div class="table-tools">
        <button class="btn-secondary" id="prevPageBtn" ${currentPage <= 1 ? "disabled" : ""}>Previous</button>
        <div style="color: var(--muted); font-size: 13px; align-self: center;">Page ${currentPage} of ${totalPages}</div>
        <button class="btn-secondary" id="nextPageBtn" ${currentPage >= totalPages ? "disabled" : ""}>Next</button>
      </div>
    `;
    document.getElementById("prevPageBtn").addEventListener("click", () => {
      if (currentPage > 1) { currentPage--; loadTable(); }
    });
    document.getElementById("nextPageBtn").addEventListener("click", () => {
      currentPage++; loadTable();
    });
  }

  async function loadTable() {
    const search = document.getElementById("searchInput").value;
    const status = document.getElementById("statusFilter").value;
    const result = await loadDevices({ page: currentPage, limit: pageSize, search, status });
    currentTotal = result.total;
    renderTable(result.devices);
    renderPagination();
  }

  let searchDebounce;
  document.getElementById("searchInput").addEventListener("input", () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => { currentPage = 1; loadTable(); }, 350);
  });
  document.getElementById("statusFilter").addEventListener("change", () => {
    currentPage = 1; loadTable();
  });

  async function refreshAll() {
    const summary = await loadSummary();
    const typeCounts = await loadTypeSummary();
    renderCards(summary);
    renderCharts(summary, typeCounts);
    await loadTable();
  }

  refreshAll();
</script>

</body>
</html>
